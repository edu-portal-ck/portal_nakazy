# HTTPS: перед програмою стає Caddy. Вмикається двома рядками у файлі .env (див. README, розділ «HTTPS»):
#   COMPOSE_FILE=docker-compose.yml:docker-compose.https.yml
#   SITE_ADDRESS=192.168.1.100        (IP або ім'я, за яким користувачі відкривають сайт)
services:
  nakazy:
    ports: !override
      - "127.0.0.1:8000:8000"   # напряму програма доступна лише на самому сервері (для перевірки в update.sh)
    environment:
      BEHIND_PROXY: "1"
      # кореневий сертифікат Caddy віддає програмі лише всередині мережі Docker (порт 8081 назовні не відкрито)
      CA_URL: http://caddy:8081/root.crt

  caddy:
    image: caddy:2.8
    container_name: nakazy-caddy
    restart: unless-stopped
    depends_on:
      - nakazy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data       # тут сертифікати, зокрема кореневий — цю папку теж копіюйте в резервні копії
      - ./caddy/config:/config
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Вкажіть SITE_ADDRESS у файлі .env}
      CADDY_TLS: ${CADDY_TLS:-internal}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
